  }
  .cta-form input::placeholder{color:#C9B3A8;}

  /* ===== FOOTER ===== */
  footer{background:var(--charcoal);color:#C9BFB5;padding:60px 40px 26px;}

    display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;max-width:1180px;margin:0 auto 40px;
  }
  .footer-grid h5{color:var(--ivory);font-size:13px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:18px;font-weight:500;}

  .footer-logo{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ivory);margin-bottom:14px;}
  .footer-bottom{
    border-top:1px solid rgba(250,243,232,0.1);padding-top:22px;max-width:1180px;margin:0 auto;
    display:flex;justify-content:space-between;font-size:12.5px;color:#8A7F74;
  }

  @media(max-width:900px){

    .hero-text{margin:0;padding:70px 30px;max-width:100%;}
    .hero-visual{min-height:320px;}

    .fabric-grid{grid-template-columns:repeat(3,1fr);}
    .product-grid{grid-template-columns:repeat(2,1fr);}
    .story{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
    .section{padding:60px 24px;}
